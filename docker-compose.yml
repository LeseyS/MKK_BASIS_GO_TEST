services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: taskdb
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./migration/mysql:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=mysql://taskuser:taskpass@tcp(mysql:3306)/taskdb"
      - "up"
    restart: on-failure

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-ui:
    image: rediscommander/redis-commander
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
      MYSQL_DB_NAME: taskdb
      REDIS_ADDR: redis:6379
      JWT_SECRET: change-me-in-production
      JWT_TTL: 20m
      LOGGER_LEVEL: info
      LOGGER_PRETTY_CONSOLE: "false"

volumes:
  mysql_data:
